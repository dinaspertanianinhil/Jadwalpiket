<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Piket Perempuan — Dinas Pertanian Indragiri Hilir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>
  :root{
    --deep-palm:#132B24;
    --paddy:#2F5D46;
    --paddy-light:#568068;
    --harvest:#E3B23C;
    --clay:#C77B4A;
    --clay-light:#E0A176;
    --paper:#F6F1E4;
    --paper-dim:rgba(246,241,228,0.68);
    --line:rgba(246,241,228,0.16);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;min-height:100vh;}

  body{
    font-family:'Manrope',sans-serif;
    color:var(--paper);
    background:
      radial-gradient(120% 90% at 85% -10%, rgba(199,123,74,0.18), transparent 55%),
      radial-gradient(100% 80% at 0% 110%, rgba(227,178,60,0.12), transparent 55%),
      linear-gradient(160deg, var(--deep-palm) 0%, #0E211C 60%, #0A1815 100%);
    display:flex;
    flex-direction:column;
    min-height:100vh;
  }

  .furrows{
    position:fixed; inset:0; pointer-events:none; opacity:0.05; z-index:0;
    background-image:repeating-linear-gradient(115deg, var(--paper) 0px, var(--paper) 1px, transparent 1px, transparent 46px);
  }

  .topbar{
    position:relative; z-index:2;
    display:flex; align-items:center; justify-content:space-between;
    padding:22px 26px 0;
  }

  .back{
    display:inline-flex; align-items:center; gap:8px;
    color:var(--paper-dim);
    text-decoration:none;
    font-size:13px; font-weight:600; letter-spacing:0.02em;
    padding:8px 14px 8px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    transition:0.3s;
  }
  .back:hover, .back:focus-visible{ color:var(--paper); border-color:rgba(246,241,228,0.35); background:rgba(246,241,228,0.06); }

  .badge{
    font-size:11px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase;
    color:var(--clay-light);
    padding:8px 14px;
    border-radius:999px;
    border:1px solid rgba(199,123,74,0.4);
    background:rgba(199,123,74,0.1);
  }

  main{
    position:relative; z-index:1;
    flex:1;
    display:flex; flex-direction:column; align-items:center;
    padding:28px 20px 40px;
  }

  .eyebrow{
    display:flex; align-items:center; gap:10px;
    font-size:12px; font-weight:700; letter-spacing:0.22em; text-transform:uppercase;
    color:var(--clay-light);
    opacity:0; animation:riseIn 0.7s ease 0.05s forwards;
  }
  .eyebrow::before, .eyebrow::after{ content:""; width:22px; height:1px; background:var(--clay-light); opacity:0.6; }

  h1{
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(34px, 6vw, 54px);
    line-height:1.03;
    letter-spacing:-0.01em;
    margin:16px 0 8px;
    text-align:center;
    opacity:0; animation:riseIn 0.8s ease 0.15s forwards;
  }
  h1 em{ font-style:italic; font-weight:500; color:var(--clay-light); }

  .subtitle{
    font-size:14px; color:var(--paper-dim);
    text-align:center; max-width:420px; margin:0 0 26px;
    opacity:0; animation:riseIn 0.8s ease 0.25s forwards;
  }

  .datechip{
    display:inline-flex; align-items:center; gap:9px;
    padding:9px 18px; border-radius:999px;
    background:rgba(246,241,228,0.06); border:1px solid var(--line);
    font-size:13px; font-weight:600;
    margin-bottom:34px;
    opacity:0; animation:riseIn 0.8s ease 0.35s forwards;
  }
  .datechip .dot{ width:7px; height:7px; border-radius:50%; background:var(--clay-light); box-shadow:0 0 0 4px rgba(199,123,74,0.22); }

  /* ROSTER CARD */
  .card{
    width:100%; max-width:520px;
    padding:30px 28px 26px;
    border-radius:22px;
    background:rgba(246,241,228,0.055);
    border:1px solid var(--line);
    backdrop-filter:blur(18px);
    opacity:0; animation:riseIn 0.8s ease 0.4s forwards;
  }

  .card-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin-bottom:20px;
    border-bottom:1px solid var(--line);
    padding-bottom:16px;
  }

  .card-head h2{
    font-family:'Fraunces',serif;
    font-weight:500; font-size:19px; margin:0;
    letter-spacing:-0.01em;
  }

  .card-head span{
    font-size:11px; font-weight:700; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--clay-light);
  }

  ul{ list-style:none; padding:0; margin:0; display:flex; flex-direction:column; gap:9px; }

  li{
    display:flex; align-items:center; gap:14px;
    padding:13px 16px;
    border-radius:14px;
    background:rgba(246,241,228,0.05);
    border:1px solid transparent;
    font-weight:600; font-size:14.5px;
    transition:0.3s;
  }
  li:hover{ background:rgba(246,241,228,0.1); border-color:var(--line); transform:translateX(2px); }

  li .num{
    font-family:'Fraunces',serif;
    font-weight:500; font-size:13px;
    color:var(--clay-light);
    min-width:22px;
  }

  .note{
    margin-top:16px;
    font-size:12px;
    color:var(--paper-dim);
    display:flex;
    align-items:center;
    gap:8px;
  }
  .note svg{ width:14px; height:14px; flex-shrink:0; opacity:0.7; }

  /* FLOATING ACTIONS */
  .fab-stack{
    position:fixed; right:22px; bottom:22px;
    display:flex; flex-direction:column; gap:12px;
    z-index:50;
  }

  .fab{
    width:52px; height:52px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line);
    background:rgba(19,43,36,0.85);
    backdrop-filter:blur(10px);
    color:var(--paper);
    cursor:pointer;
    box-shadow:0 14px 30px rgba(0,0,0,0.45);
    transition:0.3s;
  }
  .fab:hover, .fab:focus-visible{ transform:translateY(-3px); border-color:var(--clay-light); color:var(--clay-light); }
  .fab svg{ width:21px; height:21px; }

  .fab.playing{ color:var(--clay-light); border-color:var(--clay-light); }

  .field{
    position:relative; z-index:1;
    height:56px;
    display:flex; align-items:flex-end; justify-content:center;
    gap:clamp(10px, 2.4vw, 26px);
  }
  .field::before{
    content:""; position:absolute; left:0; right:0; bottom:14px; height:1px;
    background:linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent);
  }
  .sprout{
    width:2px; height:20px;
    background:linear-gradient(to top, var(--paddy), var(--paddy-light));
    border-radius:2px 2px 0 0;
    transform-origin:bottom center;
    animation:sway 4.5s ease-in-out infinite;
  }
  .sprout:nth-child(odd){ height:15px; animation-duration:5.2s; }
  .sprout:nth-child(3n){ height:24px; animation-duration:3.8s; background:linear-gradient(to top, var(--clay), var(--clay-light)); }
  .sprout:nth-child(2){ animation-delay:0.3s; }
  .sprout:nth-child(4){ animation-delay:0.9s; }
  .sprout:nth-child(5){ animation-delay:0.15s; }
  .sprout:nth-child(6){ animation-delay:0.6s; }
  .sprout:nth-child(7){ animation-delay:1.1s; }

  footer{
    position:relative; z-index:1; text-align:center;
    font-size:11px; letter-spacing:0.04em; color:rgba(246,241,228,0.4);
    padding:8px 0 20px;
  }

  @keyframes riseIn{ from{opacity:0; transform:translateY(16px);} to{opacity:1; transform:translateY(0);} }
  @keyframes sway{ 0%,100%{ transform:rotate(-4deg); } 50%{ transform:rotate(4deg); } }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; animation-iteration-count:1 !important; transition-duration:0.01ms !important; }
  }
</style>
</head>
<body>

<div class="furrows" aria-hidden="true"></div>

<div class="topbar">
  <a class="back" href="index.html">← Kembali</a>
  <span class="badge">Kelompok B</span>
</div>

<main>
  <div class="eyebrow">Kabupaten Indragiri Hilir</div>
  <h1>Piket <em>Perempuan</em></h1>
  <p class="subtitle">Rotasi mingguan, setiap hari Jumat, dimulai 17 April 2026.</p>

  <div class="datechip">
    <span class="dot" aria-hidden="true"></span>
    <span id="tanggal">Memuat tanggal…</span>
  </div>

  <div class="card">
    <div class="card-head">
      <h2>Petugas Jumat ini</h2>
      <span>Mingguan</span>
    </div>
    <ul id="petugas"></ul>
    <div class="note">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
      Menampilkan jadwal Jumat terdekat dari hari ini.
    </div>
  </div>
</main>

<div class="field" aria-hidden="true">
  <div class="sprout"></div><div class="sprout"></div><div class="sprout"></div>
  <div class="sprout"></div><div class="sprout"></div><div class="sprout"></div>
  <div class="sprout"></div><div class="sprout"></div><div class="sprout"></div>
</div>

<footer>© 2026 Sistem Internal · Dinas Pertanian Indragiri Hilir</footer>

<!-- GANTI NAMA FILE DI SINI kalau mau pakai lagu lain (taruh di folder yang sama) -->
<audio id="bgMusic" src="KennyG.mp3" loop preload="auto"></audio>

<div class="fab-stack">
  <button class="fab" id="musicBtn" title="Putar musik instrumental" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="currentColor">
      <path d="M9 18V5l12-2v13"/>
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="16" r="3"/>
    </svg>
  </button>
  <button class="fab" onclick="downloadExcel()" title="Unduh rekap Excel bulan ini">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4"/>
      <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
    </svg>
  </button>
</div>

<script>
/* ============ JADWAL ============ */

// DATA FIX (MULAI 17 APRIL) — koma ganda pada minggu 24 April sudah diperbaiki
// (sebelumnya menyisipkan satu slot kosong/undefined di antara "Ratih Cristina Dewi"
// dan "Tina Fitriani"; sekarang keduanya tampil sebagai anggota tim yang sama).
const jadwalAwal = [
{
tanggal:"2026-04-17",
petugas:["Sukmayani","Novia Dwi A","Lisa Susanti","Gusti Ayu","Afrinola Mandrasari","Ema Hikmah"]
},
{
tanggal:"2026-04-24",
petugas:["Siti Fatimah","Dwi Febri C","Tri Indah R","Yulia Anggraita","Dewi Wardati","Ratih Cristina Dewi","Tina Fitriani"]
},
{
tanggal:"2026-05-08",
petugas:["Khairiah","Misnah","Ayuni Apri Lanika","Sri Suryani","Annisa Angraini","Selvia"]
},
{
tanggal:"2026-05-15",
petugas:["Rifa'atul Ridha","Liani","Maya Restia N","Fatimah","Nurpah","Siti Zubaidah"]
},
{
tanggal:"2026-05-22",
petugas:["Nita Hayati","Thiara Septina D","Indah Chairunnisa","Yusa Alisa Putri","Riska Wulandari","Nova Yunita"]
},
{
tanggal:"2026-05-29",
petugas:["Sarinah","Kurniati Ramayulis","Widuri Novelasari","Sri Wahyuni","Megawati","Saniah"]
},
{
tanggal:"2026-06-05",
petugas:["Vera Gustina","Resti Tiaranti","Vanissa Aldi","Rodiana Wirasati","Rosmawati","Sartika Yuliani"]
}
];

// kumpulkan semua nama
let semuaNama = [];
jadwalAwal.forEach(j => semuaNama.push(...j.petugas));

// cari Jumat berjalan
function getNextFriday(){
  const today = new Date();
  let diff = 5 - today.getDay();
  if(diff < 0) diff += 7;
  let friday = new Date(today);
  friday.setDate(today.getDate() + diff);
  return friday;
}

// generate lanjutan
function generateSchedule(){
  let schedule = [...jadwalAwal];
  let index = semuaNama.length;
  let last = new Date(jadwalAwal[jadwalAwal.length-1].tanggal);

  for(let i=0;i<30;i++){
    last.setDate(last.getDate()+7);
    let team = [];
    for(let j=0;j<6;j++){
      team.push(semuaNama[index % semuaNama.length]);
      index++;
    }
    schedule.push({
      tanggal: last.toISOString().split("T")[0],
      petugas: team
    });
  }
  return schedule;
}

const schedule = generateSchedule();
const target = getNextFriday();
const targetISO = target.toISOString().split("T")[0];

document.getElementById("tanggal").textContent =
  target.toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"});

const data = schedule.find(s => s.tanggal === targetISO);
const list = document.getElementById("petugas");

if(data){
  data.petugas.forEach((n,i)=>{
    const li = document.createElement("li");
    li.innerHTML = `<span class="num">${String(i+1).padStart(2,'0')}</span><span>${n}</span>`;
    list.appendChild(li);
  });
} else {
  list.innerHTML = "<li><span>Belum ada jadwal</span></li>";
}

function downloadExcel(){
  const now = new Date();
  const dataBulan = schedule.filter(s=>{
    const d = new Date(s.tanggal);
    return d.getMonth() === now.getMonth();
  });
  const ws = XLSX.utils.aoa_to_sheet([
    ["Tanggal","Petugas 1","Petugas 2","Petugas 3","Petugas 4","Petugas 5","Petugas 6"],
    ...dataBulan.map(s => [s.tanggal, ...s.petugas])
  ]);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Jadwal");
  XLSX.writeFile(wb, "Piket_Perempuan.xlsx");
}

/* ============ MUSIK LATAR ============
   Ambil file dari elemen <audio id="bgMusic"> di atas.
   Ganti nama file di atribut src="..." kalau mau pakai lagu lain —
   taruh file musiknya satu folder dengan file HTML ini. */
const bgMusic = document.getElementById("bgMusic");
const musicBtn = document.getElementById("musicBtn");

function setPlayingUI(isPlaying){
  musicBtn.classList.toggle("playing", isPlaying);
  musicBtn.setAttribute("aria-pressed", isPlaying ? "true" : "false");
  musicBtn.title = isPlaying ? "Jeda musik" : "Putar musik";
}

function toggleMusic(){
  if(bgMusic.paused){
    bgMusic.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
  } else {
    bgMusic.pause();
    setPlayingUI(false);
  }
}

musicBtn.addEventListener("click", toggleMusic);
bgMusic.addEventListener("play", () => setPlayingUI(true));
bgMusic.addEventListener("pause", () => setPlayingUI(false));

/* Coba putar otomatis saat halaman dibuka — browser umumnya memblokir ini
   sampai ada interaksi pengguna, jadi dipasang juga fallback: musik akan
   otomatis mulai pada klik/tap pertama di halaman kalau autoplay gagal. */
window.addEventListener("load", () => {
  bgMusic.play().then(() => setPlayingUI(true)).catch(() => setPlayingUI(false));
});
document.body.addEventListener("click", function primeAudio(){
  if(bgMusic.paused) bgMusic.play().then(() => setPlayingUI(true)).catch(() => {});
  document.body.removeEventListener("click", primeAudio);
}, { once:true });
</script>

</body>
</html>
